name: Compilar ClashCraft para JAR

on:
  push:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extrair o projeto
        run: unzip -q ClashCraft_Android_novo.zip -d projeto

      - name: Compilar o mod
        working-directory: projeto/ClashCraft
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Disponibilizar JAR
        uses: actions/upload-artifact@v4
        with:
          name: ClashCraft-JAR
          path: projeto/ClashCraft/build/libs/*.jar
          if-no-files-found: error
